<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
  </defs>

  <rect width="800" height="120" fill="url(#ftBg)"/>

  <!-- Circuit traces -->
  <!-- Left side traces -->
  <line x1="0" y1="30" x2="180" y2="30" stroke="#00F0FF" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="180" y1="30" x2="200" y2="50" stroke="#00F0FF" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="50" x2="300" y2="50" stroke="#00F0FF" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
  </line>

  <line x1="0" y1="70" x2="120" y2="70" stroke="#7B2FBE" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5s" begin="1s" repeatCount="indefinite"/>
  </line>
  <line x1="120" y1="70" x2="140" y2="50" stroke="#7B2FBE" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5s" begin="1s" repeatCount="indefinite"/>
  </line>
  <line x1="140" y1="50" x2="250" y2="50" stroke="#7B2FBE" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5s" begin="1s" repeatCount="indefinite"/>
  </line>

  <line x1="0" y1="90" x2="100" y2="90" stroke="#00F0FF" stroke-width="0.8" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.3;0.12" dur="6s" begin="2s" repeatCount="indefinite"/>
  </line>

  <!-- Right side traces -->
  <line x1="800" y1="40" x2="620" y2="40" stroke="#7B2FBE" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="620" y1="40" x2="600" y2="60" stroke="#7B2FBE" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="60" x2="500" y2="60" stroke="#7B2FBE" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
  </line>

  <line x1="800" y1="80" x2="680" y2="80" stroke="#00F0FF" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="680" y1="80" x2="660" y2="60" stroke="#00F0FF" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Junction nodes -->
  <circle cx="180" cy="30" r="2.5" fill="#00F0FF" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="40" r="2.5" fill="#7B2FBE" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="70" r="2" fill="#7B2FBE" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="80" r="2" fill="#00F0FF" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Travelling data pulses -->
  <circle r="2" fill="#00F0FF" opacity="0">
    <animate attributeName="cx" values="0;180;200;300" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;30;50;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#7B2FBE" opacity="0">
    <animate attributeName="cx" values="800;620;600;500" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;40;60;60" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center text -->
  <text x="400" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#00F0FF" opacity="0.25" letter-spacing="3">
    ▪ DESIGNED BY MOBEEN MANSOOR ▪
    <animate attributeName="opacity" values="0.25;0.4;0.25" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#7B2FBE" opacity="0.2">
    [ 2026 ]
  </text>

  <!-- Bottom line -->
  <line x1="200" y1="100" x2="600" y2="100" stroke="#00F0FF" stroke-width="0.5" opacity="0.15"/>
</svg>
